[project]
name = "sabuk-inten"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.12.0",
    "google-genai>=2.29.0",
    "numpy>=2.5.3",
    "openai>=3.28.0",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=1.28.2",
]

[project.scripts]
sabuk-inten = "sabuk_inten:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
